name: Materialize Structura Windows logo

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/windows-logo-source-v2/**'
      - '.github/workflows/materialize-windows-logo.yml'

permissions:
  contents: write

jobs:
  build-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Rebuild static WebP asset
        shell: bash
        run: |
          set -euo pipefail
          for i in 00 01 02 03 04 05; do
            test -s "assets/windows-logo-source-v2/${i}.txt"
          done
          cat assets/windows-logo-source-v2/00.txt \
              assets/windows-logo-source-v2/01.txt \
              assets/windows-logo-source-v2/02.txt \
              assets/windows-logo-source-v2/03.txt \
              assets/windows-logo-source-v2/04.txt \
              assets/windows-logo-source-v2/05.txt \
            | tr -d '\r\n' \
            | base64 -d > assets/structura-windows-logo.webp
          test -s assets/structura-windows-logo.webp
          file assets/structura-windows-logo.webp

      - name: Commit static asset
        shell: bash
        run: |
          git config user.name 'Structura Brand Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add assets/structura-windows-logo.webp
          if git diff --cached --quiet; then
            echo 'Static logo already up to date.'
            exit 0
          fi
          git commit -m 'Add static Structura Windows logo'
          git push origin HEAD:main
