name: Install official Doors and Kitchen logos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-official-doors-kitchen-logos.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact approved PNG assets
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error 'https://at.adobe.com/DgvKUj8U6lD0WP09' -o assets/structura-doors-logo-official.png
          curl -L --fail --silent --show-error 'https://at.adobe.com/NW4OFHu1CzUqkaUx' -o assets/structura-kitchen-logo-official.png
          file assets/structura-doors-logo-official.png
          file assets/structura-kitchen-logo-official.png
          file assets/structura-doors-logo-official.png | grep -qi 'PNG image data, 1024 x 1024'
          file assets/structura-kitchen-logo-official.png | grep -qi 'PNG image data, 1024 x 1024'
          test "$(wc -c < assets/structura-doors-logo-official.png)" -gt 100000
          test "$(wc -c < assets/structura-kitchen-logo-official.png)" -gt 100000
      - name: Commit canonical assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/structura-doors-logo-official.png assets/structura-kitchen-logo-official.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install official Structura Doors and Kitchen logos'
          git push
