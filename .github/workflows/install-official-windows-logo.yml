name: Install official Structura Windows logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-official-windows-logo.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact approved PNG
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error 'https://at.adobe.com/QkHZ1e0guXF1mxIe' -o assets/structura-windows-logo-official.png
          file assets/structura-windows-logo-official.png
          test "$(wc -c < assets/structura-windows-logo-official.png)" -gt 600000
          file assets/structura-windows-logo-official.png | grep -qi 'PNG image data, 1024 x 1024'

      - name: Commit canonical asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/structura-windows-logo-official.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Install official Structura Windows logo'
          git push
