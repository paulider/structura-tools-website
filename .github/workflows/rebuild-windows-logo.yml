name: Rebuild Structura Windows logo

on:
  push:
    paths:
      - 'assets/windows-logo-final-source/**'
      - '.github/workflows/rebuild-windows-logo.yml'

permissions:
  contents: write

jobs:
  build-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild static WebP asset
        shell: bash
        run: |
          set -euo pipefail
          cat assets/windows-logo-final-source/*.txt | tr -d '\n\r ' | base64 -d > assets/structura-windows-logo-final.webp
          test -s assets/structura-windows-logo-final.webp
          file assets/structura-windows-logo-final.webp
      - name: Commit rebuilt asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/structura-windows-logo-final.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild Structura Windows static logo asset'
          git push
