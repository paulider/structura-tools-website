name: Normalize brand assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-brand-assets.yml'
      - 'assets/*.webp'
      - 'assets/structura-logo.png'
      - 'assets/floor-wall-icon.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-brand-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check pillow

      - name: Create static Safari-safe brand PNGs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = False
          assets = Path('assets')

          # Canonical production sources. Do not derive Structura from
          # structura-logo-official.webp: that raster contains visible corrupted
          # pixels in the lower portion of the artwork. The previously approved
          # structura-logo.png is the canonical clean source.
          # floor-wall-logo-official.webp also contains malformed frame metadata,
          # so Floor & Wall uses its stable raster source.
          sources = {
              'structura-logo.png': 'structura-logo-clean.png',
              'floor-wall-icon.jpg': 'floor-wall-logo-safe.png',
              'road-click.webp': 'road-click-safe.png',
              'buildings.webp': 'buildings-safe.png',
          }

          for src_name, dst_name in sources.items():
              src = assets / src_name
              dst = assets / dst_name
              if not src.is_file():
                  raise SystemExit(f'Missing required source asset: {src}')

              with Image.open(src) as im:
                  im.seek(0)
                  im.load()
                  has_alpha = im.mode in ('RGBA', 'LA') or 'transparency' in im.info
                  out = im.convert('RGBA' if has_alpha else 'RGB')
                  out.save(dst, format='PNG', optimize=True)

              with Image.open(dst) as check:
                  check.load()
                  if check.format != 'PNG' or getattr(check, 'n_frames', 1) != 1:
                      raise SystemExit(f'Invalid static PNG: {dst}')
                  if check.width < 1 or check.height < 1:
                      raise SystemExit(f'Empty PNG: {dst}')
                  print(f'Verified {dst}: {check.width}x{check.height}, mode={check.mode}')
          PY

      - name: Point public pages at stable image formats
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '/assets/structura-logo-official.webp': '/assets/structura-logo-clean.png',
              '/assets/structura-logo-20260813.png': '/assets/structura-logo-clean.png',
              '/assets/structura-logo-safe.png': '/assets/structura-logo-clean.png',
              '/assets/floor-wall-logo-official.webp': '/assets/floor-wall-logo-safe.png',
              '/assets/floor-wall-icon.jpg': '/assets/floor-wall-logo-safe.png',
              '/assets/road-click.webp': '/assets/road-click-safe.png',
              '/assets/buildings.webp': '/assets/buildings-safe.png',
              '/assets/pau-cols-founder.webp': '/assets/pau-cols-final.jpg',
          }

          pages = [Path('index.html'), Path('road-click.html'), Path('floor-wall.html'), Path('buildings.html')]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              # Force a fresh browser/CDN cache key for the corrected brand asset.
              text = text.replace('v=20260814-2015', 'v=20260815-0025')
              if text != original:
                  page.write_text(text, encoding='utf-8')
                  print(f'Updated {page}')
          PY

      - name: Commit normalized assets
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain assets/*-safe.png assets/structura-logo-clean.png 2>/dev/null)" ]; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/structura-logo-clean.png assets/floor-wall-logo-safe.png assets/road-click-safe.png assets/buildings-safe.png index.html road-click.html floor-wall.html buildings.html
          git commit -m 'Use clean canonical Structura logo asset'
          git push
