name: Normalize brand assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-brand-assets.yml'
      - 'scripts/normalize_brand.py'
      - 'assets/structura-logo-final.png'
      - 'assets/road-click.webp'
      - 'assets/buildings.webp'
      - '*.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-brand-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: paulider/Structura-Floor-Walls
          path: floor-source
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate definitive Structura logo
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          p=Path('assets/structura-logo-final.png')
          with Image.open(p) as im:
              im.load(); rgba=im.convert('RGBA')
              if rgba.width < 256 or rgba.height < 256: raise SystemExit(f'Logo too small: {rgba.size}')
              if getattr(im,'n_frames',1) != 1: raise SystemExit('Logo must be static')
              if max(ImageStat.Stat(rgba.convert('RGB')).var) < 25: raise SystemExit('Logo appears blank')
              lo,hi=rgba.getchannel('A').getextrema()
              if lo == 255: raise SystemExit('Logo must preserve transparency')
              print(f'Structura final: {rgba.size}, alpha={lo}-{hi}, bytes={p.stat().st_size}')
          PY

      - name: Recover current Floor Wall logo
        run: |
          rm -rf /tmp/floor-wall-rbz && mkdir -p /tmp/floor-wall-rbz
          unzip -q floor-source/Structura_Floor_Wall_V3_2_0_vray_clone_variants_DEV.rbz -d /tmp/floor-wall-rbz
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          src=Path('/tmp/floor-wall-rbz/structura_floor_wall/icons/floor_wall_logo.png')
          dst=Path('assets/floor-wall-logo-current.png')
          with Image.open(src) as im:
              im.load(); im.convert('RGBA').save(dst,'PNG',optimize=True)
          with Image.open(dst) as im:
              im.load(); print('Floor Wall current:',im.size,im.mode)
          PY

      - name: Normalize Road Click and Buildings
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          a=Path('assets')
          for s,d in {'road-click.webp':'road-click-safe.png','buildings.webp':'buildings-safe.png'}.items():
              with Image.open(a/s) as im:
                  im.seek(0); im.load(); im.convert('RGBA' if im.mode in ('RGBA','LA') or 'transparency' in im.info else 'RGB').save(a/d,'PNG',optimize=True)
          PY

      - name: Normalize and verify immutable Structura Tools brand
        run: python scripts/normalize_brand.py

      - name: Commit normalized brand system
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain assets/floor-wall-logo-current.png assets/road-click-safe.png assets/buildings-safe.png 2>/dev/null)" ]; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/floor-wall-logo-current.png assets/road-click-safe.png assets/buildings-safe.png '*.html'
          git commit -m 'Lock Structura Tools brand across all locales'
          git push
