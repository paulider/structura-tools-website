name: Normalize brand assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-brand-assets.yml'
      - 'assets/structura-logo-official.webp'
      - 'assets/road-click.webp'
      - 'assets/buildings.webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-brand-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Floor Wall source repository
        uses: actions/checkout@v4
        with:
          repository: paulider/Structura-Floor-Walls
          path: floor-source
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check pillow

      - name: Recover current Floor Wall logo from plugin package
        shell: bash
        run: |
          set -euo pipefail
          RBZ='floor-source/Structura_Floor_Wall_V3_2_0_vray_clone_variants_DEV.rbz'
          test -s "$RBZ"
          rm -rf /tmp/floor-wall-rbz
          mkdir -p /tmp/floor-wall-rbz
          unzip -q "$RBZ" -d /tmp/floor-wall-rbz
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('/tmp/floor-wall-rbz/structura_floor_wall/icons/floor_wall_logo.png')
          dst = Path('assets/floor-wall-logo-current.png')
          if not src.is_file():
              raise SystemExit('Current Floor & Wall logo is missing from plugin package')
          with Image.open(src) as im:
              im.load()
              out = im.convert('RGBA' if im.mode in ('RGBA','LA') or 'transparency' in im.info else 'RGB')
              out.save(dst, format='PNG', optimize=True)
          with Image.open(dst) as check:
              check.load()
              if check.width < 1 or check.height < 1 or getattr(check,'n_frames',1) != 1:
                  raise SystemExit('Recovered Floor & Wall logo is invalid')
              print(f'Floor Wall current: {check.width}x{check.height}, {check.mode}, bytes={dst.stat().st_size}')
          PY

      - name: Normalize Road Click and Buildings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          assets = Path('assets')
          for src_name, dst_name in {'road-click.webp':'road-click-safe.png','buildings.webp':'buildings-safe.png'}.items():
              with Image.open(assets / src_name) as im:
                  im.seek(0); im.load()
                  out = im.convert('RGBA' if im.mode in ('RGBA','LA') or 'transparency' in im.info else 'RGB')
                  out.save(assets / dst_name, format='PNG', optimize=True)
          PY

      - name: Update public references without legacy fallbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Structura: keep the CURRENT approved identity as the source of truth.
          # Do not substitute any historical wireframe icon or the blank generated PNG.
          structura_old = [
              '/assets/structura-logo-current.png',
              '/assets/structura-logo-approved.jpg',
              '/assets/structura-logo-20260813.jpg',
              '/assets/structura-logo-20260813.png',
              '/assets/structura-logo-safe.png',
              '/assets/structura-logo-clean.png',
              '/assets/structura-logo.png',
          ]
          floor_old = [
              '/assets/floor-wall-logo-official.webp',
              '/assets/floor-wall-logo-safe.png',
              '/assets/floor-wall-icon.jpg',
          ]

          pages = [Path('index.html'),Path('road-click.html'),Path('floor-wall.html'),Path('buildings.html')]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              original = text
              for old in structura_old:
                  text = text.replace(old, '/assets/structura-logo-official.webp')
              for old in floor_old:
                  text = text.replace(old, '/assets/floor-wall-logo-current.png')
              text = text.replace('/assets/road-click.webp','/assets/road-click-safe.png')
              text = text.replace('/assets/buildings.webp','/assets/buildings-safe.png')
              text = text.replace('/assets/pau-cols-founder.webp','/assets/pau-cols-final.jpg')
              text = re.sub(r'v=202608(?:13|14|15)-[0-9A-Za-z-]+','v=20260815-1310',text)
              text = re.sub(r'content="2026-08-(?:14|15)-[^"]+"','content="2026-08-15-current-brand-1310"',text)
              if text != original:
                  page.write_text(text,encoding='utf-8')
                  print(f'Updated {page}')
          PY

      - name: Block old Structura and Floor Wall artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          forbidden = [
              '/assets/structura-logo.png','/assets/structura-logo-clean.png','/assets/structura-logo-safe.png',
              '/assets/structura-logo-20260813.png','/assets/structura-logo-20260813.jpg','/assets/structura-logo-approved.jpg',
              '/assets/structura-logo-current.png','/assets/floor-wall-icon.jpg','/assets/floor-wall-logo-safe.png',
              '/assets/floor-wall-logo-official.webp'
          ]
          errors=[]
          for page in map(Path,['index.html','road-click.html','floor-wall.html','buildings.html']):
              text=page.read_text(encoding='utf-8')
              for asset in forbidden:
                  if asset in text:
                      errors.append(f'{page}: forbidden legacy/broken logo reference {asset}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('No public page references old Structura or old Floor & Wall artwork.')
          PY

      - name: Commit normalized current assets
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain assets/floor-wall-logo-current.png assets/road-click-safe.png assets/buildings-safe.png 2>/dev/null)" ]; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/floor-wall-logo-current.png assets/road-click-safe.png assets/buildings-safe.png index.html road-click.html floor-wall.html buildings.html
          git commit -m 'Restore current Structura identity and Floor Wall logo'
          git push
