name: Normalize brand assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-brand-assets.yml'
      - 'assets/structura-logo-20260813.jpg'
      - 'assets/floor-wall-logo-official.webp'
      - 'assets/road-click.webp'
      - 'assets/buildings.webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-brand-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tools
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build current production assets
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/structura-logo-20260813.jpg
          test -s assets/floor-wall-logo-official.webp

          # Floor & Wall must preserve the NEW official artwork. Extract the visual
          # frame into a static PNG; never substitute the historical floor-wall-icon.jpg.
          ffmpeg -v error -y -i assets/floor-wall-logo-official.webp -frames:v 1 /tmp/floor-wall-logo-current.png

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = False
          assets = Path('assets')

          # Approved current Structura artwork. This file is intentionally used
          # directly; structura-logo.png / *-clean.png are legacy artwork.
          with Image.open(assets / 'structura-logo-20260813.jpg') as im:
              im.load()
              if im.width < 1 or im.height < 1 or getattr(im, 'n_frames', 1) != 1:
                  raise SystemExit('Invalid approved Structura logo')
              print(f'Structura current: {im.width}x{im.height}, {im.format}')

          src = Path('/tmp/floor-wall-logo-current.png')
          dst = assets / 'floor-wall-logo-current.png'
          with Image.open(src) as im:
              im.load()
              out = im.convert('RGBA' if im.mode in ('RGBA', 'LA') or 'transparency' in im.info else 'RGB')
              out.save(dst, format='PNG', optimize=True)
          with Image.open(dst) as im:
              im.load()
              if im.width < 1 or im.height < 1 or getattr(im, 'n_frames', 1) != 1:
                  raise SystemExit('Invalid current Floor & Wall logo')
              print(f'Floor Wall current: {im.width}x{im.height}, {im.mode}')

          for src_name, dst_name in {
              'road-click.webp': 'road-click-safe.png',
              'buildings.webp': 'buildings-safe.png',
          }.items():
              with Image.open(assets / src_name) as im:
                  im.seek(0)
                  im.load()
                  out = im.convert('RGBA' if im.mode in ('RGBA', 'LA') or 'transparency' in im.info else 'RGB')
                  out.save(assets / dst_name, format='PNG', optimize=True)
              with Image.open(assets / dst_name) as check:
                  check.load()
                  if getattr(check, 'n_frames', 1) != 1:
                      raise SystemExit(f'Invalid static asset: {dst_name}')
          PY

      - name: Update public references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              '/assets/structura-logo-official.webp': '/assets/structura-logo-20260813.jpg',
              '/assets/structura-logo-safe.png': '/assets/structura-logo-20260813.jpg',
              '/assets/structura-logo-clean.png': '/assets/structura-logo-20260813.jpg',
              '/assets/structura-logo.png': '/assets/structura-logo-20260813.jpg',
              '/assets/floor-wall-logo-official.webp': '/assets/floor-wall-logo-current.png',
              '/assets/floor-wall-logo-safe.png': '/assets/floor-wall-logo-current.png',
              '/assets/floor-wall-icon.jpg': '/assets/floor-wall-logo-current.png',
              '/assets/road-click.webp': '/assets/road-click-safe.png',
              '/assets/buildings.webp': '/assets/buildings-safe.png',
              '/assets/pau-cols-founder.webp': '/assets/pau-cols-final.jpg',
          }

          pages = [Path('index.html'), Path('road-click.html'), Path('floor-wall.html'), Path('buildings.html')]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = re.sub(r'v=202608(?:13|14|15)-[0-9A-Za-z-]+', 'v=20260815-0435', text)
              text = text.replace('content="2026-08-14-official-logos-2015"', 'content="2026-08-15-current-brand-0435"')
              if text != original:
                  page.write_text(text, encoding='utf-8')
                  print(f'Updated {page}')
          PY

      - name: Block legacy visual fallbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          legacy = [
              '/assets/structura-logo.png',
              '/assets/structura-logo-clean.png',
              '/assets/structura-logo-safe.png',
              '/assets/floor-wall-icon.jpg',
              '/assets/floor-wall-logo-safe.png',
          ]
          errors = []
          for page in map(Path, ['index.html','road-click.html','floor-wall.html','buildings.html']):
              text = page.read_text(encoding='utf-8')
              for asset in legacy:
                  if asset in text:
                      errors.append(f'{page}: legacy logo reference {asset}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('Public pages use only current approved Structura/Floor Wall artwork.')
          PY

      - name: Commit current brand assets
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain assets/floor-wall-logo-current.png assets/road-click-safe.png assets/buildings-safe.png 2>/dev/null)" ]; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/floor-wall-logo-current.png assets/road-click-safe.png assets/buildings-safe.png index.html road-click.html floor-wall.html buildings.html
          git commit -m 'Restore approved current Structura and Floor Wall logos'
          git push
