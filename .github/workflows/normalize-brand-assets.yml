name: Normalize brand assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-brand-assets.yml'
      - 'assets/structura-logo-approved.jpg'
      - 'assets/road-click.webp'
      - 'assets/buildings.webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-brand-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Floor Wall source repository
        uses: actions/checkout@v4
        with:
          repository: paulider/Structura-Floor-Walls
          path: floor-source
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check pillow

      - name: Normalize approved Structura artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          assets = Path('assets')
          src = assets / 'structura-logo-approved.jpg'
          dst = assets / 'structura-logo-current.png'

          # Exact approved NEW Structura blob restored from repository history.
          # The historical JPEG is missing only terminal bytes; decode once in
          # tolerant mode and rewrite it as a strict static PNG.
          ImageFile.LOAD_TRUNCATED_IMAGES = True
          with Image.open(src) as im:
              im.load()
              if im.width < 1 or im.height < 1:
                  raise SystemExit('Approved Structura source is empty')
              im.convert('RGB').save(dst, format='PNG', optimize=True)
          ImageFile.LOAD_TRUNCATED_IMAGES = False

          with Image.open(dst) as im:
              im.load()
              if im.width != 384 or im.height != 384 or getattr(im, 'n_frames', 1) != 1:
                  raise SystemExit(f'Unexpected Structura output: {im.size}, frames={getattr(im,"n_frames",1)}')
              print(f'Structura current: {im.width}x{im.height}, {im.mode}')
          PY

      - name: Recover approved Floor Wall logo from plugin package
        shell: bash
        run: |
          set -euo pipefail
          RBZ='floor-source/Structura_Floor_Wall_V3_2_0_vray_clone_variants_DEV.rbz'
          test -s "$RBZ"
          rm -rf /tmp/floor-wall-rbz
          mkdir -p /tmp/floor-wall-rbz
          unzip -q "$RBZ" -d /tmp/floor-wall-rbz

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile
          import shutil
          import re

          root = Path('/tmp/floor-wall-rbz')
          out = Path('assets/floor-wall-logo-current.png')

          def key(name):
              return re.sub(r'[^a-z0-9]+', '', name.lower())

          exact_keys = {
              'floorwalllogo',
              'floorwalllogov2',
              'iconofloorwalltransparenthdv2',
              'iconofloorwallhdv2',
          }

          pngs = sorted(p for p in root.rglob('*') if p.is_file() and p.suffix.lower() == '.png')
          exact = [p for p in pngs if key(p.stem) in exact_keys]

          print('PNG candidates inside Floor & Wall package:')
          for p in pngs:
              try:
                  with Image.open(p) as im:
                      print(f'  {p.relative_to(root)} | {im.width}x{im.height} | {im.mode}')
              except Exception as exc:
                  print(f'  {p.relative_to(root)} | unreadable: {exc}')

          if not exact:
              # Do not silently regress to an old/general icon. The workflow must fail
              # until the approved logo source is positively identified.
              likely = [p for p in pngs if 'floor' in key(p.stem) and ('logo' in key(p.stem) or 'icon' in key(p.stem))]
              print('Likely Floor & Wall candidates:', [str(p.relative_to(root)) for p in likely])
              raise SystemExit('Approved Floor & Wall logo not found by canonical filename in plugin package')

          # Prefer an exact canonical filename. If duplicates exist, prefer the largest
          # decoded raster because the June-approved asset was the HD transparent version.
          scored = []
          ImageFile.LOAD_TRUNCATED_IMAGES = False
          for p in exact:
              with Image.open(p) as im:
                  im.load()
                  scored.append((im.width * im.height, p, im.width, im.height, im.mode))
          scored.sort(reverse=True, key=lambda x: x[0])
          _, src, w, h, mode = scored[0]
          print(f'Using approved Floor & Wall source: {src.relative_to(root)} | {w}x{h} | {mode}')

          with Image.open(src) as im:
              im.load()
              has_alpha = im.mode in ('RGBA', 'LA') or 'transparency' in im.info
              normalized = im.convert('RGBA' if has_alpha else 'RGB')
              normalized.save(out, format='PNG', optimize=True)

          with Image.open(out) as check:
              check.load()
              if check.width < 1 or check.height < 1 or getattr(check, 'n_frames', 1) != 1:
                  raise SystemExit('Recovered Floor & Wall logo is invalid')
              print(f'Floor Wall current: {check.width}x{check.height}, {check.mode}')
          PY

      - name: Normalize Road Click and Buildings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          assets = Path('assets')
          for src_name, dst_name in {
              'road-click.webp': 'road-click-safe.png',
              'buildings.webp': 'buildings-safe.png',
          }.items():
              with Image.open(assets / src_name) as im:
                  im.seek(0)
                  im.load()
                  out = im.convert('RGBA' if im.mode in ('RGBA','LA') or 'transparency' in im.info else 'RGB')
                  out.save(assets / dst_name, format='PNG', optimize=True)
              with Image.open(assets / dst_name) as check:
                  check.load()
                  if getattr(check, 'n_frames', 1) != 1:
                      raise SystemExit(f'Invalid static asset: {dst_name}')
          PY

      - name: Update public references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              '/assets/structura-logo-official.webp': '/assets/structura-logo-current.png',
              '/assets/structura-logo-approved.jpg': '/assets/structura-logo-current.png',
              '/assets/structura-logo-20260813.jpg': '/assets/structura-logo-current.png',
              '/assets/structura-logo-20260813.png': '/assets/structura-logo-current.png',
              '/assets/structura-logo-safe.png': '/assets/structura-logo-current.png',
              '/assets/structura-logo-clean.png': '/assets/structura-logo-current.png',
              '/assets/structura-logo.png': '/assets/structura-logo-current.png',
              '/assets/floor-wall-logo-official.webp': '/assets/floor-wall-logo-current.png',
              '/assets/floor-wall-logo-safe.png': '/assets/floor-wall-logo-current.png',
              '/assets/floor-wall-icon.jpg': '/assets/floor-wall-logo-current.png',
              '/assets/road-click.webp': '/assets/road-click-safe.png',
              '/assets/buildings.webp': '/assets/buildings-safe.png',
              '/assets/pau-cols-founder.webp': '/assets/pau-cols-final.jpg',
          }

          pages = [Path('index.html'), Path('road-click.html'), Path('floor-wall.html'), Path('buildings.html')]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = re.sub(r'v=202608(?:13|14|15)-[0-9A-Za-z-]+', 'v=20260815-1045', text)
              text = re.sub(r'content="2026-08-(?:14|15)-[^"]+"', 'content="2026-08-15-approved-brand-1045"', text)
              if text != original:
                  page.write_text(text, encoding='utf-8')
                  print(f'Updated {page}')
          PY

      - name: Block legacy and broken logo references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          legacy = [
              '/assets/structura-logo.png',
              '/assets/structura-logo-clean.png',
              '/assets/structura-logo-safe.png',
              '/assets/structura-logo-20260813.png',
              '/assets/structura-logo-20260813.jpg',
              '/assets/structura-logo-approved.jpg',
              '/assets/structura-logo-official.webp',
              '/assets/floor-wall-icon.jpg',
              '/assets/floor-wall-logo-safe.png',
              '/assets/floor-wall-logo-official.webp',
          ]
          errors = []
          for page in map(Path, ['index.html','road-click.html','floor-wall.html','buildings.html']):
              text = page.read_text(encoding='utf-8')
              for asset in legacy:
                  if asset in text:
                      errors.append(f'{page}: legacy/broken logo reference {asset}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('No public page references legacy or damaged brand artwork.')
          PY

      - name: Commit normalized current assets
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain assets/structura-logo-current.png assets/floor-wall-logo-current.png assets/road-click-safe.png assets/buildings-safe.png 2>/dev/null)" ]; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/structura-logo-current.png assets/floor-wall-logo-current.png assets/road-click-safe.png assets/buildings-safe.png index.html road-click.html floor-wall.html buildings.html
          git commit -m 'Restore approved current Structura and Floor Wall logos'
          git push
