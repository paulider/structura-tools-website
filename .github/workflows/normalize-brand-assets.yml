name: Normalize brand assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-brand-assets.yml'
      - 'assets/*.webp'
      - 'assets/floor-wall-icon.jpg'
      - 'assets/structura-logo-20260813.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-brand-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image verifier
        run: python -m pip install --disable-pip-version-check pillow

      - name: Extract static Safari-safe brand assets
        shell: bash
        run: |
          set -euo pipefail

          # ffmpeg is preinstalled on the GitHub Ubuntu runner. Unlike a browser, it
          # serializes one decoded visual frame to a plain static PNG, removing broken
          # WebP animation/alpha container metadata that can corrupt Safari rendering.
          extract_png() {
            src="$1"
            dst="$2"
            ffmpeg -hide_banner -loglevel error -y -i "$src" -frames:v 1 "$dst"
          }

          extract_png assets/structura-logo-official.webp assets/structura-logo-safe.png

          # This supplied Floor & Wall WebP has malformed extra-frame metadata. Prefer
          # the approved artwork if ffmpeg can recover frame 0; otherwise use the stable
          # raster copy already in the repository rather than serving a corrupt stream.
          if ! extract_png assets/floor-wall-logo-official.webp assets/floor-wall-logo-safe.png; then
            echo 'WARNING: malformed Floor & Wall WebP; using verified JPEG source.'
            extract_png assets/floor-wall-icon.jpg assets/floor-wall-logo-safe.png
          fi

          extract_png assets/road-click.webp assets/road-click-safe.png
          extract_png assets/buildings.webp assets/buildings-safe.png

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = False
          required = [
              Path('assets/structura-logo-safe.png'),
              Path('assets/floor-wall-logo-safe.png'),
              Path('assets/road-click-safe.png'),
              Path('assets/buildings-safe.png'),
          ]

          for path in required:
              with Image.open(path) as im:
                  im.load()
                  if im.format != 'PNG':
                      raise SystemExit(f'Not a PNG: {path}')
                  if getattr(im, 'n_frames', 1) != 1:
                      raise SystemExit(f'Not static: {path}')
                  if im.width < 1 or im.height < 1:
                      raise SystemExit(f'Empty image: {path}')
                  print(f'Verified {path}: {im.width}x{im.height}, mode={im.mode}')
          PY

      - name: Point public pages at stable image formats
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '/assets/structura-logo-official.webp': '/assets/structura-logo-safe.png',
              '/assets/structura-logo-20260813.png': '/assets/structura-logo-safe.png',
              '/assets/floor-wall-logo-official.webp': '/assets/floor-wall-logo-safe.png',
              '/assets/floor-wall-icon.jpg': '/assets/floor-wall-logo-safe.png',
              '/assets/road-click.webp': '/assets/road-click-safe.png',
              '/assets/buildings.webp': '/assets/buildings-safe.png',
              '/assets/pau-cols-founder.webp': '/assets/pau-cols-final.jpg',
          }

          pages = [Path('index.html'), Path('road-click.html'), Path('floor-wall.html'), Path('buildings.html')]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text != original:
                  page.write_text(text, encoding='utf-8')
                  print(f'Updated {page}')
          PY

      - name: Commit normalized assets
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain assets/*-safe.png 2>/dev/null)" ]; then
            echo 'No normalization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/structura-logo-safe.png assets/floor-wall-logo-safe.png assets/road-click-safe.png assets/buildings-safe.png index.html road-click.html floor-wall.html buildings.html
          git commit -m 'Use Safari-safe decoded brand assets'
          git push
