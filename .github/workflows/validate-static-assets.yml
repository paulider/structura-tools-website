name: Validate static assets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate references, full image decoding and current brand assets
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import os
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = False
          errors = []
          refs = set()

          public_brand_pages = {
              'index.html',
              'road-click.html',
              'floor-wall.html',
              'buildings.html',
          }

          legacy_public_assets = {
              'assets/structura-logo.png',
              'assets/structura-logo-clean.png',
              'assets/structura-logo-safe.png',
              'assets/floor-wall-icon.jpg',
              'assets/floor-wall-logo-safe.png',
          }

          required_current = [
              Path('assets/structura-logo-20260813.jpg'),
              Path('assets/floor-wall-logo-current.png'),
              Path('assets/road-click-safe.png'),
              Path('assets/buildings-safe.png'),
              Path('assets/pau-cols-final.jpg'),
          ]

          for html in glob.glob('*.html'):
              text = open(html, encoding='utf-8').read()
              local_refs = re.findall(r'(?:src|href)=["\']([^"\']+)', text)
              for ref in local_refs:
                  if ref.startswith(('http://', 'https://', 'mailto:', '#', 'data:')):
                      continue
                  clean = urlsplit(ref).path
                  if not clean:
                      continue
                  path = clean.lstrip('/')
                  if path.endswith('/'):
                      path += 'index.html'
                  refs.add((html, path))

                  if html in public_brand_pages and path.lower().endswith('.webp'):
                      errors.append(f'{html}: direct WebP reference forbidden: {path}')
                  if html in public_brand_pages and path in legacy_public_assets:
                      errors.append(f'{html}: legacy brand artwork referenced: {path}')

          for html, path in sorted(refs):
              if not os.path.isfile(path):
                  errors.append(f'{html}: missing local asset/page: {path}')

          for path in required_current:
              if not path.is_file():
                  errors.append(f'missing required current public asset: {path}')
                  continue
              try:
                  with Image.open(path) as im:
                      im.load()
                      if im.width < 1 or im.height < 1:
                          errors.append(f'zero-sized public asset: {path}')
                      if getattr(im, 'n_frames', 1) != 1:
                          errors.append(f'public asset must be static: {path}')
              except Exception as exc:
                  errors.append(f'invalid current public asset: {path}: {exc}')

          # Decode every non-source raster fully. Source WebPs may be malformed in
          # metadata but are never allowed to be referenced directly by public pages.
          for path in sorted(glob.glob('assets/*')):
              if not os.path.isfile(path):
                  continue
              ext = os.path.splitext(path)[1].lower()
              if ext not in {'.png', '.jpg', '.jpeg', '.webp'}:
                  continue
              try:
                  with Image.open(path) as im:
                      if ext == '.webp':
                          im.seek(0)
                          frame = im.copy()
                          frame.load()
                      else:
                          im.load()
              except Exception as exc:
                  if ext == '.webp':
                      print(f'WARNING source WebP requires normalization: {path}: {exc}')
                  else:
                      errors.append(f'failed full image decode: {path}: {exc}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)

          print(f'Validated {len(refs)} references and current approved brand assets; no legacy public artwork detected.')
          PY
