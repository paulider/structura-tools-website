name: Validate static assets

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image decoder
        run: python -m pip install --disable-pip-version-check pillow

      - name: Validate references, images and immutable Structura Tools brand
        shell: bash
        run: |
          python - <<'PY'
          import glob
          import os
          import re
          import sys
          from pathlib import Path
          from urllib.parse import urlsplit
          from PIL import Image, ImageFile, ImageStat

          ImageFile.LOAD_TRUNCATED_IMAGES = False
          errors = []
          refs = set()

          legacy_assets = {
              'assets/structura-logo-official.webp',
              'assets/structura-logo-current.png',
              'assets/structura-logo.png',
              'assets/structura-logo-clean.png',
              'assets/structura-logo-safe.png',
              'assets/structura-logo-20260813.png',
              'assets/structura-logo-20260813.jpg',
              'assets/structura-logo-approved.jpg',
              'assets/floor-wall-icon.jpg',
              'assets/floor-wall-logo-safe.png',
              'assets/floor-wall-logo-official.webp',
          }

          translated_brand = {
              'HERRAMIENTAS STRUCTURA',
              'ESTRUCTURA',
              'EINES STRUCTURA',
              'OUTILS STRUCTURA',
              'STRUMENTI STRUCTURA',
          }

          required_current = [
              Path('assets/structura-logo-final.png'),
              Path('assets/floor-wall-logo-current.png'),
              Path('assets/road-click-safe.png'),
              Path('assets/buildings-safe.png'),
              Path('assets/pau-cols-final.jpg'),
          ]

          html_files = sorted(glob.glob('*.html'))
          for html in html_files:
              text = Path(html).read_text(encoding='utf-8')

              for phrase in translated_brand:
                  if phrase in text:
                      errors.append(f'{html}: translated Structura Tools brand remains: {phrase}')

              brand = re.search(r'<a\b[^>]*class=["\'][^"\']*\bbrand\b[^"\']*["\'][^>]*>.*?</a>', text, re.I | re.S)
              if brand:
                  block = brand.group(0)
                  if 'structura-logo-final.png' not in block:
                      errors.append(f'{html}: header does not use definitive Structura logo')
                  plain = re.sub(r'<[^>]+>', ' ', block)
                  if not re.search(r'\bSTRUCTURA\s+TOOLS\b', plain, re.I):
                      errors.append(f'{html}: header brand name is not Structura Tools')

              if 'landing-title' in text:
                  title = re.search(r'<h1\b[^>]*class=["\'][^"\']*\blanding-title\b[^"\']*["\'][^>]*>(.*?)</h1>', text, re.I | re.S)
                  if title and not re.match(r'\s*STRUCTURA TOOLS\s*<span\b', title.group(1), re.I | re.S):
                      errors.append(f'{html}: landing hero brand name is not Structura Tools')
                  hero_logo = re.search(r'<img\b[^>]*class=["\'][^"\']*\blanding-hero-logo\b[^"\']*["\'][^>]*>', text, re.I | re.S)
                  if hero_logo and 'structura-logo-final.png' not in hero_logo.group(0):
                      errors.append(f'{html}: landing hero does not use definitive Structura logo')

              local_refs = re.findall(r'(?:src|href)=["\']([^"\']+)', text)
              for ref in local_refs:
                  if ref.startswith(('http://', 'https://', 'mailto:', '#', 'data:')):
                      continue
                  clean = urlsplit(ref).path
                  if not clean:
                      continue
                  path = clean.lstrip('/')
                  if path.endswith('/'):
                      path += 'index.html'
                  refs.add((html, path))
                  if path in legacy_assets:
                      errors.append(f'{html}: legacy/broken brand asset referenced: {path}')

          for html, path in sorted(refs):
              if not os.path.isfile(path):
                  errors.append(f'{html}: missing local asset/page: {path}')

          for path in required_current:
              if not path.is_file():
                  errors.append(f'missing required current public asset: {path}')
                  continue
              try:
                  with Image.open(path) as im:
                      im.load()
                      if im.width < 1 or im.height < 1:
                          errors.append(f'zero-sized public asset: {path}')
                      if getattr(im, 'n_frames', 1) != 1:
                          errors.append(f'public asset must be static: {path}')
                      if path.name == 'structura-logo-final.png':
                          rgba = im.convert('RGBA')
                          lo, hi = rgba.getchannel('A').getextrema()
                          if lo == 255:
                              errors.append('definitive Structura logo lost transparent background')
                          if max(ImageStat.Stat(rgba.convert('RGB')).var) < 25:
                              errors.append('definitive Structura logo appears visually blank')
              except Exception as exc:
                  errors.append(f'invalid current public asset: {path}: {exc}')

          # Fully decode public non-WebP raster assets. Source WebPs can remain only as
          # internal normalization inputs; HTML is forbidden from referencing them.
          for path in sorted(glob.glob('assets/*')):
              if not os.path.isfile(path):
                  continue
              ext = os.path.splitext(path)[1].lower()
              if ext not in {'.png', '.jpg', '.jpeg', '.webp'}:
                  continue
              try:
                  with Image.open(path) as im:
                      if ext == '.webp':
                          im.seek(0)
                          frame = im.copy()
                          frame.load()
                      else:
                          im.load()
              except Exception as exc:
                  if ext == '.webp':
                      print(f'WARNING source WebP requires normalization: {path}: {exc}')
                  else:
                      errors.append(f'failed full image decode: {path}: {exc}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)

          print(f'Validated {len(html_files)} HTML pages, {len(refs)} local references and the definitive Structura Tools brand contract.')
          PY
